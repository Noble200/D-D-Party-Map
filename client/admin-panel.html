<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - D&D Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        h1 {
            color: #d4a726;
            font-size: 1.8rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #d4a726;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        /* Table */
        .table-container {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a2e;
            border-bottom: 1px solid #333;
        }

        .table-header h2 {
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background: #1a1a2e;
            font-weight: 600;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        tr:hover {
            background: #1f2b4a;
        }

        .code {
            font-family: monospace;
            background: #0f0f1a;
            padding: 3px 8px;
            border-radius: 4px;
            color: #d4a726;
        }

        .date {
            color: #888;
            font-size: 0.85rem;
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #d4a726;
            color: #000;
        }

        .btn-primary:hover {
            background: #e5b82a;
        }

        .btn-danger {
            background: #8b1e3f;
            color: #fff;
        }

        .btn-danger:hover {
            background: #a62548;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        /* Checkbox */
        .checkbox-cell {
            width: 40px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Actions bar */
        .actions-bar {
            display: none;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #1f2b4a;
            border-bottom: 1px solid #333;
        }

        .actions-bar.visible {
            display: flex;
        }

        .selected-count {
            color: #888;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: #2d5a27;
        }

        .notification.error {
            background: #8b1e3f;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Confirm modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #d4a726;
        }

        .modal-content p {
            margin-bottom: 25px;
            color: #888;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel de Administración</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="loadData()">Actualizar</button>
                <button class="btn btn-danger" onclick="showCleanupModal()">Limpiar Inactivas</button>
            </div>
        </header>

        <!-- Estadísticas -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="statRooms">-</div>
                <div class="stat-label">Salas Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statUsers">-</div>
                <div class="stat-label">Usuarios</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statMaps">-</div>
                <div class="stat-label">Mapas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statActive24h">-</div>
                <div class="stat-label">Activas (24h)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statActive7d">-</div>
                <div class="stat-label">Activas (7d)</div>
            </div>
        </div>

        <!-- Tabla de salas -->
        <div class="table-container">
            <div class="table-header">
                <h2>Salas</h2>
            </div>

            <div class="actions-bar" id="actionsBar">
                <span class="selected-count"><span id="selectedCount">0</span> seleccionadas</span>
                <button class="btn btn-danger btn-small" onclick="deleteSelected()">Eliminar seleccionadas</button>
                <button class="btn btn-secondary btn-small" onclick="clearSelection()">Cancelar</button>
            </div>

            <div id="tableContent">
                <p class="loading">Cargando...</p>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3 id="modalTitle">Confirmar</h3>
            <p id="modalMessage">¿Estás seguro?</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-danger" id="modalConfirmBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/admin';
        let selectedRooms = new Set();

        // Cargar datos al inicio
        document.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            await Promise.all([loadStats(), loadRooms()]);
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const data = await res.json();

                if (data.success) {
                    document.getElementById('statRooms').textContent = data.stats.total_rooms;
                    document.getElementById('statUsers').textContent = data.stats.total_users;
                    document.getElementById('statMaps').textContent = data.stats.total_maps;
                    document.getElementById('statActive24h').textContent = data.stats.active_rooms_24h;
                    document.getElementById('statActive7d').textContent = data.stats.active_rooms_7d;
                }
            } catch (error) {
                console.error('Error cargando stats:', error);
            }
        }

        async function loadRooms() {
            const container = document.getElementById('tableContent');

            try {
                const res = await fetch(`${API_URL}/rooms`);
                const data = await res.json();

                if (!data.success || data.rooms.length === 0) {
                    container.innerHTML = '<p class="empty">No hay salas</p>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th class="checkbox-cell">
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
                                </th>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Mapas</th>
                                <th>Jugadores</th>
                                <th>Última actividad</th>
                                <th>Creada</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.rooms.map(room => `
                                <tr>
                                    <td class="checkbox-cell">
                                        <input type="checkbox" value="${room.code}" onchange="toggleSelect(this)">
                                    </td>
                                    <td><span class="code">${room.code}</span></td>
                                    <td>${room.name}</td>
                                    <td>${room.maps_count}</td>
                                    <td>${room.characters_count}</td>
                                    <td class="date">${formatDate(room.last_activity)}</td>
                                    <td class="date">${formatDate(room.created_at)}</td>
                                    <td>
                                        <button class="btn btn-danger btn-small" onclick="deleteRoom('${room.code}', '${room.name}')">
                                            Eliminar
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                selectedRooms.clear();
                updateActionsBar();
            } catch (error) {
                console.error('Error cargando salas:', error);
                container.innerHTML = '<p class="empty">Error al cargar salas</p>';
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function toggleSelectAll(checkbox) {
            const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
                if (checkbox.checked) {
                    selectedRooms.add(cb.value);
                } else {
                    selectedRooms.delete(cb.value);
                }
            });
            updateActionsBar();
        }

        function toggleSelect(checkbox) {
            if (checkbox.checked) {
                selectedRooms.add(checkbox.value);
            } else {
                selectedRooms.delete(checkbox.value);
            }
            updateActionsBar();
        }

        function updateActionsBar() {
            const bar = document.getElementById('actionsBar');
            const count = document.getElementById('selectedCount');
            count.textContent = selectedRooms.size;
            bar.classList.toggle('visible', selectedRooms.size > 0);
        }

        function clearSelection() {
            selectedRooms.clear();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateActionsBar();
        }

        function deleteRoom(code, name) {
            showConfirmModal(
                'Eliminar Sala',
                `¿Eliminar la sala "${name}" (${code})? Esta acción no se puede deshacer.`,
                async () => {
                    try {
                        const res = await fetch(`${API_URL}/rooms/${code}`, { method: 'DELETE' });
                        const data = await res.json();

                        if (data.success) {
                            showNotification('Sala eliminada', 'success');
                            loadData();
                        } else {
                            showNotification(data.error || 'Error', 'error');
                        }
                    } catch (error) {
                        showNotification('Error de conexión', 'error');
                    }
                }
            );
        }

        function deleteSelected() {
            const codes = Array.from(selectedRooms);
            showConfirmModal(
                'Eliminar Salas',
                `¿Eliminar ${codes.length} salas seleccionadas? Esta acción no se puede deshacer.`,
                async () => {
                    try {
                        const res = await fetch(`${API_URL}/rooms/delete-multiple`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ codes })
                        });
                        const data = await res.json();

                        if (data.success) {
                            showNotification(`${data.count} salas eliminadas`, 'success');
                            loadData();
                        } else {
                            showNotification(data.error || 'Error', 'error');
                        }
                    } catch (error) {
                        showNotification('Error de conexión', 'error');
                    }
                }
            );
        }

        function showCleanupModal() {
            showConfirmModal(
                'Limpiar Salas Inactivas',
                '¿Eliminar todas las salas sin actividad en los últimos 7 días?',
                async () => {
                    try {
                        const res = await fetch(`${API_URL}/cleanup`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ days: 7 })
                        });
                        const data = await res.json();

                        if (data.success) {
                            showNotification(`${data.count} salas eliminadas`, 'success');
                            loadData();
                        } else {
                            showNotification(data.error || 'Error', 'error');
                        }
                    } catch (error) {
                        showNotification('Error de conexión', 'error');
                    }
                }
            );
        }

        function showConfirmModal(title, message, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalConfirmBtn').onclick = () => {
                closeModal();
                onConfirm();
            };
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // Cerrar modal con Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
